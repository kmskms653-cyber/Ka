function gen(k,n){if(k=='t')return Array.from({length:20},(_,i)=>TB[(i+n)%TB.length]);
const r=rng(n*7919+1),R=m=>Math.floor(r()*m),qs=[];
for(let i=0;i<20;i++){let q,a,e,t=R(4);
if(t==0){const x=R(40)+10,y=R(40)+10;a=x+y;q=`${x} + ${y} = ؟`;e=`نجمع الآحاد ثم العشرات: ${x}+${y}=${a}`}

else if(t==2){const s=R(5)+2,d=R(6)+2;a=s+d*4;q=`أكمل المتتالية: ${s}، ${s+d}، ${s+2*d}، ${s+3*d}، ؟`;e=`الفرق ثابت = ${d} فالتالي ${a}`}

ml":"<p>I <b>am</b> a student.<br>He / She / It <b>is</b> happy.<br>You / We / They <b>are</b> friends.</p><p>النفي: I am <b>not</b> tired. • السؤال: <b>Are</b> you ready?</p>"},{"h":"الجمع","type":"text","html":"<p>غالباً نضيف <b>s</b>: book → books.<br>بعد s أو x أو ch نضيف <b>es</b>: box → boxes.<br>جمع شاذ: man → men • child → children.</p>"},{"h":"a و an","type":"text","html":"<p>نستخدم <b>a</b> قبل الحرف الساكن: a book, a dog.<br>ونستخدم <b>an</b> قبل الحرف المتحرك (a e i o u): an apple, an egg.</p>"},{"h":"this / that","type":"text","html":"<p><b>This</b> is my bag. (هذا، قريب منك)<br><b>That</b> is your bag. (ذاك، بعيد عنك)</p>"},{"h":"المضارع البسيط","type":"text","html":"<p>نستخدمه للعادات والحقائق: I <b>drink</b> water every day.<br>مع he / she / it نضيف s: She <b>drinks</b> milk. He <b>goes</b> to school.</p>"},{"h":"الأسئلة","type":"text","html":"<p><b>What</b> ما؟ What is your name?<br><b>Where</b> أين؟ Where is the book?<br><b>Who</b> من؟ Who is he?<br><b>How</b> كيف؟ How are you?</p>"}]},{"t":"قواعد اللغة الإنجليزية","d":"18 درساً مبسطاً بالأمثلة والترجمة واختبار","i":"📘","secs":[{"h":"الصفات","type":"text","html":"<p>الصفة تصف الاسم وتأتي قبله، ولا تتغير في الجمع.</p><p><span dir='ltr'>a big house</span> — بيت كبير<br><span dir='ltr'>two red cars</span> — سيارتان حمراوان<br><span dir='ltr'>She is happy.</span> — هي سعيدة.</p>"},{"h":"أداة التعريف the","type":"text","html":"<p>نستخدم the للشيء المعروف أو الوحيد.</p><p><span dir='ltr'>The sun is hot.</span> — الشمس حارة.<br><span dir='ltr'>Open the door.</span> — افتح الباب.</p>"},{"h":"صفات الملكية","type":"text","html":"<p>my لي • your لك • his له • her لها • its له (لغير العاقل) • our لنا • their لهم. ونضيف 's للملكية.</p><p><span dir='ltr'>This is my bag.</span> — هذه حقيبتي.<br><span dir='ltr'>Her name is Sara.</span> — اسمها سارة.<br><span dir='ltr'>Ali's book</span> — كتاب علي</p>"},{"h":"ضمائر المفعول","type":"text","html":"<p>me • you • him • her • it • us • them: تأتي بعد الفعل.</p><p><span dir='ltr'>Call me.</span> — اتصل بي.<br><span dir='ltr'>I like them.</span> — أحبهم.<br><span dir='ltr'>She helps us.</span> — هي تساعدنا.</p>"},{"h":"there is / there are","type":"text","html":"<p>نستخدم there is مع المفرد وthere are مع الجمع للدلالة على الوجود.</p><p><span dir='ltr'>There is a cat on the desk.</span> — توجد قطة على المكتب.<br><span dir='ltr'>There are three books.</span> — توجد ثلاثة كتب.<br><span dir='ltr'>Is there a pen?</span> — هل يوجد قلم؟</p>"},{"h":"حروف الجر للمكان","type":"text","html":"<p>in داخل • on فوق سطح • under تحت • next to بجانب • behind خلف • in front of أمام.</p><p><span dir='ltr'>The book is on the desk.</span> — الكتاب فوق المكتب.<br><span dir='ltr'>The cat is under the chair.</span> — القطة تحت الكرسي.<br><span dir='ltr'>The bag is next to the door.</span> — الحقيبة بجانب الباب.</p>"},{"h":"حروف الجر للزمن","type":"text","html":"<p>at مع الساعة • on مع اليوم • in مع الشهر والسنة.</p><p><span dir='ltr'>at 5 o'clock</span> — الساعة الخامسة<br><span dir='ltr'>on Friday</span> — يوم الجمعة<br><span dir='ltr'>in June</span> — في يونيو</p>"},{"h":"can / can't","type":"text","html":"<p>نستخدم can للقدرة، والفعل بعدها بدون s.</p><p><span dir='ltr'>I can swim.</span> — أستطيع السباحة.<br><span dir='ltr'>She can't drive.</span> — هي لا تستطيع القيادة.<br><span dir='ltr'>Can you help me?</span> — هل تستطيع مساعدتي؟</p>"},{"h":"المضارع البسيط: النفي والسؤال","type":"text","html":"<p>للنفي do not (don't) أو does not (doesn't). وللسؤال Do أو Does. بعد does يرجع الفعل بدون s.</p><p><span dir='ltr'>I do not like tea.</span> — لا أحب الشاي.<br><span dir='ltr'>She does not play.</span> — هي لا تلعب.<br><span dir='ltr'>Do you like milk?</span> — هل تحب الحليب؟<br><span dir='ltr'>Does he live here?</span> — هل يسكن هنا؟</p>"},{"h":"المضارع المستمر","type":"text","html":"<p>am / is / are + فعل بنهاية ing لما يحدث الآن.</p><p><span dir='ltr'>I am reading.</span> — أنا أقرأ الآن.<br><span dir='ltr'>He is eating.</span> — هو يأكل.<br><span dir='ltr'>Are you sleeping?</span> — هل أنت نائم؟</p>"},{"h":"الماضي مع was / were","type":"text","html":"<p>was مع I وhe وshe وit. وwere مع you وwe وthey.</p><p><span dir='ltr'>I was tired.</span> — كنت متعباً.<br><span dir='ltr'>They were at home.</span> — كانوا في البيت.</p>"},{"h":"الماضي البسيط","type":"text","html":"<p>الأفعال المنتظمة تنتهي بـ ed. والشاذة تتغير: go → went • eat → ate • see → saw • have → had. وللنفي did not + الفعل الأصلي.</p><p><span dir='ltr'>I played football.</span> — لعبت كرة القدم.<br><span dir='ltr'>We went to school.</span> — ذهبنا إلى المدرسة.<br><span dir='ltr'>I did not go.</span> — لم أذهب.</p>"},{"h":"المستقبل","type":"text","html":"<p>will + فعل للوعد والقرار السريع. وbe going to + فعل للخطط.</p><p><span dir='ltr'>I will help you.</span> — سأساعدك.<br><span dir='ltr'>We are going to travel.</span> — سنسافر.</p>"},{"h":"الأمر","type":"text","html":"<p>نبدأ بالفعل مباشرة. وللنهي نضع Don't قبله.</p><p><span dir='ltr'>Open the book.</span> — افتح الكتاب.<br><span dir='ltr'>Don't run.</span> — لا تركض.<br><span dir='ltr'>Please sit down.</span> — تفضل بالجلوس.</p>"},{"h":"المقارنة","type":"text","html":"<p>الصفة القصيرة + er: big → bigger. والطويلة مع more: beautiful → more beautiful. ونستخدم than للمقارنة. وللأعلى: the tallest • the most beautiful.</p><p><span dir='ltr'>Ali is taller than Omar.</span> — علي أطول من عمر.<br><span dir='ltr'>This book is more interesting.</span> — هذا الكتاب أكثر إثارة.<br><span dir='ltr'>She is the tallest.</span> — هي الأطول.</p>"},{"h":"some / any / much / many","type":"text","html":"<p>some في الإثبات، وany في النفي والسؤال. many مع المعدود، وmuch مع غير المعدود.</p><p><span dir='ltr'>I have some apples.</span> — عندي بعض التفاح.<br><span dir='ltr'>Do you have any milk?</span> — هل عندك حليب؟<br><span dir='ltr'>How many books?</span> — كم كتاباً؟<br><span dir='ltr'>How much water?</span> — كم من الماء؟</p>"},{"h":"أدوات الربط","type":"text","html":"<p>and و • but لكن • or أو • because لأن • so لذلك.</p><p><span dir='ltr'>I am tired but happy.</span> — أنا متعب لكن سعيد.<br><span dir='ltr'>I stayed home because it was raining.</span> — بقيت في البيت لأن السماء تمطر.</p>"},{"h":"كلمات الاستفهام","type":"text","html":"<p>What ما • Where أين • When متى • Why لماذا • Who من • Which أي • How many كم (معدود) • How much كم (غير معدود).</p><p><span dir='ltr'>Why are you late?</span> — لماذا تأخرت؟<br><span dir='ltr'>When is the class?</span> — متى الحصة؟<br><span dir='ltr'>Which color do you like?</span> — أي لون تحب؟</p>"},{"h":"استمع لأمثلة القواعد","type":"grid","slow":1,"items":[{"s":"There is a cat on the desk.","say":"There is a cat on the desk.","l":"en"},{"s":"The book is on the desk.","say":"The book is on the desk.","l":"en"},{"s":"I can swim very well.","say":"I can swim very well.","l":"en"},{"s":"She does not play football.","say":"She does not play football.","l":"en"},{"s":"I am reading a book now.","say":"I am reading a book now.","l":"en"},{"s":"We went to school yesterday.","say":"We went to school yesterday.","l":"en"},{"s":"I will help you tomorrow.","say":"I will help you tomorrow.","l":"en"},{"s":"Ali is taller than Omar.","say":"Ali is taller than Omar.","l":"en"},{"s":"Do you have any milk?","say":"Do you have any milk?","l":"en"},{"s":"Why are you late?","say":"Why are you late?","l":"en"}]},{"h":"اختبار القواعد الموسّع (15 سؤالاً)","type":"quiz","qs":[{"q":"There ___ three books on the desk.","o":["is","are","am","be"],"a":1,"e":"الجمع يأخذ there are."},{"q":"The cat is ___ the chair. (تحت)","o":["at","under","of","to"],"a":1,"e":"under = تحت."},{"q":"I can ___ English.","o":["speaks","speak","speaking","spoke"],"a":1,"e":"بعد can يأتي الفعل بدون s."},{"q":"She ___ playing now.","o":["am","is","are","do"],"a":1,"e":"مع she نستخدم is في المضارع المستمر."},{"q":"Yesterday I ___ to school.","o":["go","goes","went","going"],"a":2,"e":"ماضي go هو went."},{"q":"Ali is ___ than Omar.","o":["tall","taller","tallest","more tall"],"a":1,"e":"المقارنة: الصفة القصيرة + er."},{"q":"I do not ___ tea.","o":["likes","liking","like","liked"],"a":2,"e":"بعد do not يأتي الفعل الأصلي."},{"q":"___ you like milk?","o":["Do","Does","Is","Are"],"a":0,"e":"مع you نستخدم Do."},{"q":"___ he live here?","o":["Do","Does","Is","Are"],"a":1,"e":"مع he نستخدم Does."},{"q":"We meet ___ Friday.","o":["at","in","on","to"],"a":2,"e":"مع الأيام نستخدم on."},{"q":"How ___ books do you have?","o":["much","many","some","any"],"a":1,"e":"الكتب معدودة فنستخدم many."},{"q":"This is ___ bag. (حقيبتي)","o":["me","my","I","mine"],"a":1,"e":"صفة الملكية: my."},{"q":"I stayed home ___ it was raining.","o":["because","but","or","so"],"a":0,"e":"because = لأن."},{"q":"I ___ help you tomorrow.","o":["will","did","am","do"],"a":0,"e":"المستقبل: will + فعل."},{"q":"Call ___! (اتصل بي)","o":["I","my","me","mine"],"a":2,"e":"ضمير المفعول: me."}]}]},{"t":"المفردات والاستماع","d":"مفردات يومية مع المعاني وقصص قصيرة","i":"🎧","secs":[{"h":"الأرقام","type":"grid","items":[{"s":"one","say":"one","l":"en"},{"s":"two","say":"two","l":"en"},{"s":"three","say":"three","l":"en"},{"s":"four","say":"four","l":"en"},{"s":"five","say":"five","l":"en"},{"s":"six","say":"six","l":"en"},{"s":"seven","say":"seven","l":"en"},{"s":"eight","say":"eight","l":"en"},{"s":"nine","say":"nine","l":"en"},{"s":"ten","say":"ten","l":"en"}]},{"type":"text","html":"<p class=\"m\">المعاني:</p><p><b dir=\"ltr\">one</b> = واحد • <b dir=\"ltr\">two</b> = اثنان • <b dir=\"ltr\">three</b> = ثلاثة • <b dir=\"ltr\">four</b> = أربعة • <b dir=\"ltr\">five</b> = خمسة • <b dir=\"ltr\">six</b> = ستة • <b dir=\"ltr\">seven</b> = سبعة • <b dir=\"ltr\">eight</b> = ثمانية • <b dir=\"ltr\">nine</b> = تسعة • <b dir=\"ltr\">ten</b> = عشرة</p>"},{"h":"الألوان","type":"grid","items":[{"s":"red","say":"red","l":"en"},{"s":"blue","say":"blue","l":"en"},{"s":"green","say":"green","l":"en"},{"s":"yellow","say":"yellow","l":"en"},{"s":"black","say":"black","l":"en"},{"s":"white","say":"white","l":"en"},{"s":"orange","say":" msg+=(k=='q'?'القدرات':'التحصيلي')+': '+rows.length+' اختباراً، '+qs.length+' سؤالاً\n'}}
