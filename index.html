<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>منصة التأسيس والقدرات</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ef;--bgi:linear-gradient(160deg,#fff1c9 0%,#ffe0ec 45%,#d9f1ff 100%);--c:#fff;--t:#2a1f4d;--p:#6c4cf1;--p2:#ece7ff;--ok:#2e9e5b;--bad:#d64545;--m:#6b7a90;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2b1a5e;--bgi:linear-gradient(160deg,#2f1c72 0%,#5b2382 45%,#0f5a86 100%);--c:#3a2d84;--t:#fff;--p:#b9a2ff;--p2:#4b3fa0;--m:#d5ccf7}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bgi);background-attachment:fixed;min-height:100vh;color:var(--t);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}
#app{max-width:640px;margin:auto;padding:12px}
.card{background:var(--c);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0002}
.big{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;cursor:pointer;width:100%;border:0;color:var(--t);text-align:right}
.big i{font-style:normal;background:var(--p2);color:var(--p);border-radius:12px;min-width:48px;height:48px;display:grid;place-items:center;font-size:24px}
button{font:inherit}.b{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
.b.g{background:var(--p2);color:var(--p)}.b.r{background:var(--bad)}.b.o{background:var(--ok)}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--m);background:var(--c);color:var(--t);margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.grid button{background:var(--p2);color:var(--t);border:0;border-radius:12px;padding:12px 4px;font-size:22px;cursor:pointer}
.grid button.on{background:var(--p);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2,h3{margin:8px 0}.m{color:var(--m);font-size:14px}
.o1{display:block;width:100%;text-align:start;margin:4px 0;padding:10px;border-radius:10px;border:1px solid var(--m);background:var(--c);color:var(--t);cursor:pointer}
.o1.sel{border-color:var(--p);background:var(--p2)}.o1.ok{background:#2e9e5b33;border-color:var(--ok)}.o1.bad{background:#d6454533;border-color:var(--bad)}
canvas{width:100%;height:220px;background:var(--c);border:2px dashed var(--p);border-radius:14px;touch-action:none}
img.rc{max-width:100%;border-radius:10px}.tabs{display:flex;gap:6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;text-align:center}td,th{border:1px solid var(--m);padding:4px}

.top h2{background:linear-gradient(90deg,#ff7a59,#6c4cf1);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc,.cc{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:20px;padding:16px;margin:10px 0;text-align:right;color:#fff;cursor:pointer;box-shadow:0 6px 16px #0003;transition:transform .15s}
.sc:active,.cc:active{transform:scale(.97)}
.sc>span:nth-child(2),.cc>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.sc b{font-size:20px}.sc small{opacity:.92;font-size:13px}.sc em{font-style:normal;font-size:28px}
.ei{font-size:36px;background:#fff3;border-radius:16px;width:60px;height:60px;display:grid;place-items:center;animation:fl 3s ease-in-out infinite}
.hero{display:flex;align-items:center;gap:12px;color:#fff;border-radius:20px;padding:16px;margin:10px 0}.hero b{font-size:21px;display:block}.hero small{opacity:.92}
.cc{background:var(--c);color:var(--t);box-shadow:0 3px 10px #0002}.cc b{font-size:18px}.cc small{color:var(--m);font-size:13px}.cc em{font-style:normal}
.ci{font-size:26px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff}
.grid button:nth-child(4n+1){background:#ff7a5933}.grid button:nth-child(4n+2){background:#4dc9f633}.grid button:nth-child(4n+3){background:#00b89433}.grid button:nth-child(4n){background:#ffb02e33}
.grid button.on{background:var(--p)!important;color:#fff;transform:scale(1.06)}
@keyframes fl{50%{transform:translateY(-4px) rotate(-4deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pi{font:inherit;background:linear-gradient(135deg,#ff7a59,#ffb347);color:#fff;border:0;border-radius:20px;padding:2px 12px;cursor:pointer;box-shadow:0 2px 6px #0003}
#ib{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--c);color:var(--t);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px #0006;z-index:99;border:1px solid var(--p)}
#ib img{width:44px;height:44px;border-radius:12px}#ib div{flex:1;display:flex;flex-direction:column;line-height:1.4}#ib small{color:var(--m);font-size:12px}#ib .x{background:none;border:0;color:var(--m);font-size:18px;cursor:pointer;padding:4px}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% 18%,#ffd23f66 0,transparent 26%),radial-gradient(circle at 88% 26%,#ff5d8f55 0,transparent 28%),radial-gradient(circle at 25% 88%,#3ec5ff55 0,transparent 30%),radial-gradient(circle at 92% 92%,#7cf29a55 0,transparent 26%);animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{to{transform:scale(1.12) rotate(2deg)}}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.qn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.qt{flex:1;line-height:1.7;padding-top:6px}
.grid.w2{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.grid.w2 button{font-size:19px;padding:12px 6px;overflow-wrap:anywhere}
.grid.w3{grid-template-columns:1fr}.grid.w3 button{font-size:20px;padding:14px 10px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;flex-direction:column;align-items:center;background:var(--p2);border-radius:12px;padding:6px 12px;min-width:84px}
.chip b{font-size:17px}.chip i{font-style:normal;color:var(--m);font-size:15px}
body::after{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:98;pointer-events:none}
.sm{background:#2e9e5b26;border:1px solid var(--ok);border-radius:12px;padding:10px 12px;font-weight:700}.em{background:#d6454526;border:1px solid var(--bad);border-radius:12px;padding:10px 12px}

#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center bottom}

return h}
async function stt(id,s){const o={status:s};if(s=='none')o.receipt_path=null;const q=await sb.from('profiles').update(o).eq('id',id);if(q.error)alert(q.error.message);admLoad()}

async function saveTree(silent){try{const t=silent?S.tree:JSON.parse(document.getElementById('tj').value);const q=await sb.from('content').upsert({id:1,tree:t});if(q.error)throw q.error;S.tree=t;alert('تم الحفظ');if(silent)r()}catch(e){alert('تعذر الحفظ: '+(e.message||'JSON غير صالح'))}}
async function saveCfg(){const c={};['m','y','bank','name','iban'].forEach(k=>c[k]=document.getElementById('c_'+k).value);const fv=document.getElementById('c_free').value;if(fv){const p=fv.split(':');c.free={si:+p[0],ci:+p[1]}}const q=await sb.from('settings').upsert({id:1,cfg:c});if(q.error)return alert(q.error.message);S.cfg=c;alert('تم الحفظ')}

function testsV(k){const A=S.tl[k];

async function loadTL(k){S.tl[k]='L';const q=await sb.from('question_bank').select('test_no,title').eq('track',k).order('test_no');S.tl[k]=q.data||[];r()}
async function testQ(k,n,rnd){S.busy=1;r();const q=await sb.from('question_bank').select('qs').eq('track',k).eq('test_no',n).single();S.busy=0;
if(q.error||!q.data){r();return alert('تعذر تحميل الاختبار')}let qs=q.data.qs;if(rnd)qs=[...qs].sort(()=>Math.random()-.5);S.qz={qs,a:[],d:0};go('quiz')}
function randQ(k){const A=S.tl[k];if(!A||A==='L'||!A.length)return;testQ(k,A[Math.floor(Math.random()*A.length)].test_no,1)}
function bankV(){const b=S.adm.b||[],c=t=>b.filter(x=>x.track==t).length;
return`<div class="card"><h3>بنك الأسئلة</h3><p>القدرات: <b>${c('q')}</b> اختباراً • التحصيلي: <b>${c('t')}</b> اختباراً</p><p class="m">اختر ملفي الأسئلة (JSON) من جهازك، ويمكن اختيار الملفين معاً. إعادة الاستيراد تحدّث الاختبارات.</p><label class="b o" style="display:inline-block">📂 اختيار ملفات الأسئلة<input type="file" accept=".json,application/json" multiple hidden onchange="impBank(this.files)"></label></div>`}
async function impBank(fl){if(!fl.length)return;S.busy=1;r();let msg='';
try{for(const f of fl){const d=JSON.parse(await f.text()),qs=(d.questions||[]).slice().sort((a,b)=>a.questionNumber-b.questionNumber);if(!qs.length){msg+=f.name+': لا توجد أسئلة\n';continue}
const k=qs[0].track=='التحصيلي'?'t':'q',g={};
qs.forEach(x=>{(g[x.testNumber]=g[x.testNumber]||{title:x.testTitle,qs:[]}).qs.push({q:x.question,o:x.options,a:x.correctIndex,e:x.explanation||'',s:x.section||''})});
const rows=Object.keys(g).map(n=>({track:k,test_no:+n,title:g[n].title,qs:g[n].qs}));
for(let i=0;i<rows.length;i+=5){const u=await sb.from('question_bank').upsert(rows.slice(i,i+5));if(u.error)throw u.error}
msg+=(k=='q'?'القدرات':'التحصيلي')+': '+rows.length+' اختباراً، '+qs.length+' سؤالاً\n'}}
catch(e){msg+='خطأ: '+(e.message||e)+'\n(هل شغّلت ملف SQL الخاص ببنك الأسئلة؟)'}
S.tl={};S.busy=0;alert(msg);admLoad()}
function gc(a){const m=Math.max(...a.map(x=>[...x.s].length));return m>14?'w3':m>5?'w2':''}
function fixHtml(h){return h.replace(/<p class="m">المعاني:<\/p><p>([\s\S]*?)<\/p>/,(m,b)=>'<p class="m">المعاني:</p><div class="chips">'+b.split(' • ').map(x=>{const y=x.split(' = ');return '<span class="chip"><b dir="ltr">'+y[0].replace(/<[^>]*>/g,'')+'</b><i>'+(y[1]||'')+'</i></span>'}).join('')+'</div>')}

async function impLang(fl){if(!fl.length)return;try{const st=JSON.parse(await fl[0].text());if(!st.t||!Array.isArray(st.c))throw new Error('ملف غير صالح');const i=S.tree.findIndex(x=>x.t==st.t);if(i>=0)S.tree[i]=st;else S.tree.push(st);await saveTree(1)}catch(e){alert('تعذر الاستيراد: '+(e.message||e))}}

(function(){
