const{data:{session}}=await sb.auth.getSession();if(!session){S.me=null;S.busy=0;return r()}
const uid=session.user.id;
const[p,a,c]=await Promise.all([sb.from('profiles').select('*').eq('id',uid).single(),sb.rpc('is_admin'),sb.from('settings').select('cfg').eq('id',1).single()]);
const pr=p.data;S.me=pr?{id:uid,n:pr.name||pr.email,e:pr.email,st:pr.status,plan:pr.plan,rp:pr.receipt_path,admin:!!a.data}:null;
if(c.data)S.cfg=c.data.cfg;
if(S.me&&ok()){const t=await sb.from('content').select('tree').eq('id',1).maybeSingle();S.tree=t.data?t.data.tree:[];
if(S.me.admin&&!t.data){S.tree=seed();await sb.from('content').insert({id:1,tree:S.tree})}}
else if(S.me){const o=await sb.rpc('get_outline');S.tree=o.data||[]}
S.rurl=null;if(S.me&&S.me.rp){const u=await sb.storage.from('receipts').createSignedUrl(S.me.rp,3600);S.rurl=u.data&&u.data.signedUrl}
S.busy=0;r()}
function r(){if(S.busy){app.innerHTML='<div class="card">⏳ جارٍ التحميل...</div>';return}
const u=S.me;if(!u){app.innerHTML=authV();return}
let h=`<div class="top"><h2>🌟 منصة التأسيس</h2><div>${u.admin?'<button class="b g" onclick="go(\'admin\')">الإدارة</button> ':''}<button class="b g" onclick="out()">خروج</button></div></div><div class="m">👋 مرحباً ${esc(u.n)} — ${u.admin?'مشرف':`<button class="pi" onclick="go('pay')">💳 ${u.st=='active'?'اشتراك فعّال':u.st=='pending'?'قيد المراجعة — عرض الإيصال':'غير مشترك — اشترك وأرفق الإيصال'} 📎</button>`}</div>`;
if(S.v!='home')h+=`<p><button class="b g" onclick="back()">← رجوع</button></p>`;
const V={home:homeV,stage:stageV,class:classV,pay:payV,quiz:quizV,admin:adminV}[S.v];
app.innerHTML=h+V();if(S.v=='class')initCv()}
function authV(){return`<div class="card"><h2>${S.reg?'إنشاء حساب':'تسجيل الدخول'}</h2>${S.reg?'<input id="n" placeholder="الاسم">':''}<input id="e" type="email" placeholder="البريد الإلكتروني"><input id="p" type="password" placeholder="كلمة المرور (٨ أحرف على الأقل)"><p><button class="b" onclick="auth()">${S.reg?'تسجيل':'دخول'}</button> <button class="b g" onclick="S.reg=!S.reg;S.msg='';r()">${S.reg?'لدي حساب':'حساب جديد'}</button></p>${S.msg?`<p class="m">${esc(S.msg)}</p>`:''}</div>`}
async function auth(){const g=i=>(document.getElementById(i)||{}).value||'',e=g('e').trim().toLowerCase(),p=g('p'),n=g('n');if(!e||!p)return alert('أكمل الحقول');S.busy=1;r();let x;
if(S.reg){x=await sb.auth.signUp({email:e,password:p,options:{data:{name:n}}});if(!x.error&&!x.data.session){S.busy=0;S.reg=0;S.msg='تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد ثم سجّل الدخول.';return r()}}
else x=await sb.auth.signInWithPassword({email:e,password:p});
if(x.error){S.busy=0;S.msg='خطأ: '+x.error.message;return r()}S.msg='';S.v='home';refresh()}
async function out(){await sb.auth.signOut();S.me=null;S.tree=[];S.v='home';r()}
function payV(){const u=S.me,c=S.cfg;if(u.admin)return`<div class="card">أنت مشرف — لا تحتاج اشتراكاً.</div>`;
const note=u.st=='active'?`<div class="card"><h3>✅ اشتراكك فعّال</h3><p>الخطة: ${u.plan=='y'?'سنوي':'شهري'}</p></div>`:u.st=='pending'?`<div class="card"><h3>⏳ إيصالك قيد المراجعة</h3><p>سيتم تفعيل حسابك بعد موافقة المشرف.</p>${S.rurl?`<img class="rc" src="${S.rurl}">`:''}<p class="m">يمكنك استبدال الإيصال من الأسفل.</p></div>`:`<div class="card"><h3>🔒 المحتوى للمشتركين فقط</h3></div>`;
if(u.st=='active')return note;
return note+`<div class="card"><p>اختر الخطة:</p><button class="o1 ${S.plan=='m'?'sel':''}" onclick="S.plan='m';r()">شهري — ${esc(c.m)} ريال سعودي</button><button class="o1 ${S.plan=='y'?'sel':''}" onclick="S.plan='y';r()">سنوي — ${esc(c.y)} ريال سعودي</button></div>
<div class="card"><h3>بيانات التحويل</h3><p>البنك: <b>${esc(c.bank)}</b><br>اسم الحساب: <b>${esc(c.name)}</b><br>الآيبان: <b dir="ltr">${esc(c.iban)}</b></p><label class="b g" style="display:inline-block">📎 إرفاق صورة الإيصال<input type="file" accept="image/*" hidden onchange="rcpt(this.files[0])"></label>${S.rc?`<img class="rc" src="${S.rc}">`:''}<p><button class="b" onclick="sub()">${u.st=='pending'?'إرسال الإيصال الجديد':'إرسال للمراجعة'}</button></p><p><button class="b g" onclick="refresh()">🔄 تحديث حالة الاشتراك</button></p></div>`}
function rcpt(f){if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{S.rcb=b;S.rc=URL.createObjectURL(b);r()},'image/jpeg',.7)};im.src=URL.createObjectURL(f)}
async function sub(){if(!S.rcb)return alert('ارفع الإيصال أولاً');S.busy=1;r();const path=`${S.me.id}/${Date.now()}.jpg`;
const up=await sb.storage.from('receipts').upload(path,S.rcb,{contentType:'image/jpeg'});if(up.error){S.busy=0;r();return alert('فشل الرفع: '+up.error.message)}
const q=await sb.rpc('submit_receipt',{p_path:path,p_plan:S.plan});if(q.error)alert(q.error.message);S.rc=S.rcb=null;refresh()}
async function admLoad(){S.busy=1;r();const A=S.adm;
if(S.tab=='r'||S.tab=='u'){const q=await sb.from('profiles').select('*').order('created_at',{ascending:false});A.u=q.data||[];
if(S.tab=='r'){const ps=A.u.filter(x=>x.status=='pending'&&x.receipt_path).map(x=>x.receipt_path);A.url={};if(ps.length){const s=await sb.storage.from('receipts').createSignedUrls(ps,3600);(s.data||[]).forEach(x=>A.url[x.path]=x.signedUrl)}}}
S.busy=0;r()}
function adminV(){const t=S.tab,A=S.adm,T=(k,l)=>`<button class="b ${t==k?'':'g'}" onclick="S.tab='${k}';admLoad()">${l}</button>`;let h=`<div class="tabs">${T('r','الاشتراكات')}${T('c','المحتوى')}${T('u','المستخدمون')}${T('s','الإعدادات')}</div>`;
if(t=='r'){const p=(A.u||[]).filter(u=>u.status=='pending');h+=p.length?p.map(u=>`<div class="card"><b>${esc(u.name)}</b> <span class="m">${esc(u.email)} — ${u.plan=='y'?'سنوي':'شهري'}</span>${A.url&&A.url[u.receipt_path]?`<img class="rc" src="${A.url[u.receipt_path]}">`:''}<p><button class="b o" onclick="stt('${u.id}','active')">موافقة</button> <button class="b r" onclick="stt('${u.id}','none')">رفض</button></p></div>`).join(''):'<div class="card">لا توجد طلبات معلقة</div>'}
if(t=='c')h+=`<div class="card"><p class="m">عدّل المراحل والصفوف والشروحات بصيغة JSON ثم احفظ.</p><textarea id="tj" dir="ltr" rows="16">${esc(JSON.stringify(S.tree,null,1))}</textarea><button class="b" onclick="saveTree()">حفظ</button> <button class="b g" onclick="if(confirm('استعادة الافتراضي؟')){S.tree=seed();saveTree(1)}">استعادة</button></div>`;
if(t=='u')h+=(A.u||[]).map(u=>`<div class="card"><b>${esc(u.name)}</b> <span class="m">${esc(u.email)} — ${u.is_admin?'مشرف':u.status}</span>${u.id==S.me.id?'':`<p><button class="b g" onclick="adm('${u.id}',${!u.is_admin})">${u.is_admin?'إلغاء الإشراف':'تعيين مشرف'}</button> <button class="b g" onclick="stt('${u.id}','${u.status=='active'?'none':'active'}')">${u.status=='active'?'إيقاف الاشتراك':'تفعيل الاشتراك'}</button></p>`}</div>`).join('');
if(t=='s'){const c=S.cfg;h+=`<div class="card">${[['m','السعر الشهري'],['y','السعر السنوي'],['bank','البنك'],['name','اسم الحساب'],['iban','الآيبان']].map(([k,l])=>`${l}<input id="c_${k}" value="${esc(c[k])}">`).join('')}<button class="b" onclick="saveCfg()">حفظ</button></div>`}
return h}
async function stt(id,s){const o={status:s};if(s=='none')o.receipt_path=null;const q=await sb.from('profiles').update(o).eq('id',id);if(q.error)alert(q.error.message);admLoad()}
async function adm(id,v){const q=await sb.from('profiles').update({is_admin:v}).eq('id',id);if(q.error)alert(q.error.message);admLoad()}
async function saveTree(silent){try{const t=silent?S.tree:JSON.parse(document.getElementById('tj').value);const q=await sb.from('content').upsert({id:1,tree:t});if(q.error)throw q.error;S.tree=t;alert('تم الحفظ');if(silent)r()}catch(e){alert('تعذر الحفظ: '+(e.message||'JSON غير صالح'))}}
async function saveCfg(){const c={};['m','y','bank','name','iban'].forEach(k=>c[k]=document.getElementById('c_'+k).value);const q=await sb.from('settings').upsert({id:1,cfg:c});if(q.error)return alert(q.error.message);S.cfg=c;alert('تم الحفظ')}
r();refresh();

</script></body></html>
